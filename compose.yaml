services:
  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/just.sqlite3
    volumes:
      - just-data:/app/data
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  just-data:

# Optional voice activity deployment is described in ACTIVITY.md. Build the SDK before the image.
# Expose the Activity port only to your HTTPS reverse proxy; the bot's default is loopback-only.
