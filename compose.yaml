services:
  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/just.sqlite3
    volumes:
      - just-data:/app/data
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  just-data:
