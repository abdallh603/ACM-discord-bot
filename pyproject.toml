[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "roundforge-bot"
version = "0.8.0"
description = "A public Codeforces community Discord bot with managed multiplayer Blitz"
requires-python = ">=3.11"
dependencies = ["discord.py>=2.6,<3", "python-dotenv>=1,<2", "tzdata>=2025.2", "Pillow>=13,<14", "aiohttp>=3.14,<4"]

[project.scripts]
roundforge = "just_bot.__main__:main"

[tool.setuptools.packages.find]
include = ["just_bot*", "extensions*"]
exclude = ["*.tests", "*.tests.*"]

[tool.setuptools.package-data]
extensions = ["README.md", "*/extension.toml", "tournament/assets/*.png", "tournament/assets/*.md",
              "activity/web/*.html", "activity/web/*.js", "activity/web/*.css", "activity/web/*.json",
              "activity/web/vendor/*.js", "activity/web/vendor/*.txt", "activity/web/vendor/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
