[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "roundforge-bot"
version = "0.6.0"
description = "A public Codeforces community Discord bot with managed multiplayer Blitz"
requires-python = ">=3.11"
dependencies = ["discord.py>=2.6,<3", "python-dotenv>=1,<2", "tzdata>=2025.2", "Pillow>=13,<14"]

[project.scripts]
roundforge = "just_bot.__main__:main"

[tool.setuptools.packages.find]
include = ["just_bot*"]

[tool.setuptools.package-data]
just_bot = ["assets/*.png", "assets/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
